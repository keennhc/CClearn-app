# Builds the Android app via EAS and notifies Slack — triggered by version tags (e.g. v1.0.5) on main
name: EAS Build

# Triggers: only when a tag matching v* is pushed
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: EAS Production Build
    runs-on: ubuntu-latest

    steps:
      # Pull the repo code onto the GitHub runner
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Abort if the tagged commit is not on main
      - name: Check tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/main; then
            echo "Tag is not on main — skipping build."
            exit 1
          fi

      # Install Node 20 and cache npm dependencies for faster runs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Clean install — uses package-lock.json exactly, no surprises
      - name: Install dependencies
        run: npm ci

      # Install EAS CLI and authenticate using the EXPO_TOKEN secret
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Send the Android build to Expo's servers using the production profile in eas.json
      - name: Build (Android)
        run: eas build --platform android --profile production --non-interactive

      # Always runs (pass or fail) — posts build status and commit link to Slack
      - name: Notify Slack
        if: always()
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-type: application/json' \
            -d '{"text": "EAS Build *${{ job.status }}* for `${{ github.ref_name }}` by ${{ github.actor }}\nhttps://github.com/${{ github.repository }}/commit/${{ github.sha }}"}'
