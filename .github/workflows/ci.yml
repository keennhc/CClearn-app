# Runs typecheck, unit tests, and notifies Slack on every push to main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --passWithNoTests --ci

      - name: Notify Slack
        if: always()
        env:
          COMMITS_JSON: ${{ toJson(github.event.commits) }}
        run: |
          MESSAGES=$(echo "$COMMITS_JSON" | jq -r '.[].message | "> " + .')
          PAYLOAD=$(jq -n \
            --arg text "CI *${{ job.status }}* on \`${{ github.ref_name }}\` by ${{ github.actor }}\n${MESSAGES}\nhttps://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
            '{text: $text}')
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-type: application/json' \
            -d "$PAYLOAD"
